name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: msva
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/msva?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm --filter @msva/db migrate
      - name: Build shared, contracts, and database package declarations
        run: pnpm --filter @msva/shared --filter @msva/contracts --filter @msva/db build
      - name: Check generated demo contracts
        run: pnpm contracts:check
      - name: Validate demo contracts in Python 3.12
        working-directory: apps/voice-agent
        run: PYTHONDONTWRITEBYTECODE=1 uv run --frozen --python 3.12 pytest
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm -r build
