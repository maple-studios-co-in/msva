name: msva-livekit

services:
  redis:
    image: redis:7.4.7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    networks: [media-private]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/livekit/start-livekit.sh"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml.template:ro
      - ./start-livekit.sh:/etc/livekit/start-livekit.sh:ro
    depends_on:
      redis:
        condition: service_healthy
    networks: [media-private]
    ports:
      - "7881:7881/tcp"
      - "50000-60000:50000-60000/udp"
    healthcheck:
      test: ["CMD", "/livekit-server", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

  voice-agent:
    build:
      context: ../../apps/voice-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["voice"]
    env_file:
      - path: .env
        required: false
    volumes:
      - voice-spool:/var/lib/msva-voice-agent
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      # Calls are only taken while their evidence can be delivered.
      voice-replay:
        condition: service_healthy
    networks: [media-private, provider-egress]
    # The worker's 120 s drain plus time for the SDK's forced shutdown and each call's
    # final delivery wait, so a deploy stop lets calls finish.
    stop_grace_period: 150s
    expose: ["8081"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8081/', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  voice-replay:
    build:
      context: ../../apps/voice-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["voice"]
    env_file:
      - path: .env
        required: false
    volumes:
      - voice-spool:/var/lib/msva-voice-agent
    networks: [provider-egress]
    stop_grace_period: 15s
    # The one process that delivers evidence, live calls' included. Needs only
    # VOICE_INTERNAL_API_URL, VOICE_REPLAY_CREDENTIAL_KEY and the shared spool, and runs
    # while calls are disabled.
    command: ["uv", "run", "--frozen", "python", "-m", "madhusudan_voice.replay"]
    healthcheck:
      # Fails once no delivery round has completed for 30 s: the loop is alive, which is
      # not the same as the API accepting what it sends.
      test: ["CMD", "uv", "run", "--frozen", "python", "-m", "madhusudan_voice.replay", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  sip:
    image: livekit/sip:v1.13.0
    restart: unless-stopped
    profiles: ["sip-unimplemented"]
    env_file:
      - path: .env
        required: false
    environment:
      LIVEKIT_WS_URL: ${LIVEKIT_INTERNAL_WS_URL}
    volumes:
      - ./sip.yaml:/etc/livekit/sip.yaml:ro
    command: ["--config", "/etc/livekit/sip.yaml"]
    networks: [media-private]
    # Intentionally unsupported: host networking is required for public RTP/SIP
    # ranges and cannot resolve Docker's private Redis service. Do not enable this
    # profile until the carrier/firewall and DNS runbook is implemented.

networks:
  media-private:
    internal: true
  provider-egress:

volumes:
  redis-data:
  voice-spool:
