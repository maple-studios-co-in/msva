# Production-template values. This file does not provision DNS, TLS, TURN, or firewall rules.
# This template is rendered by start-livekit.sh into a root-only runtime file.
# Credentials intentionally do not use literal shell placeholders in YAML.
redis:
  address: redis:6379
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
logging:
  level: info
  json: true
