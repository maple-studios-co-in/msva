# Production-template values. This file does not provision DNS, TLS, TURN, or firewall rules.
# This template is rendered by start-livekit.sh into a root-only runtime file.
# Credentials intentionally do not use literal shell placeholders in YAML.
redis:
  address: redis:6379
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # Private pilot network: never attempt public STUN discovery from this isolated
  # service. A future public-media deployment must provide a reviewed explicit
  # advertised node IP and firewall/TURN policy before changing this to true.
  use_external_ip: false
logging:
  level: info
  json: true
