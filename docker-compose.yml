# Local infrastructure for development. The services themselves run with
# `pnpm dev:all`; this only provides Postgres and Redis.
#
#   docker compose up -d
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/msva
#   REDIS_URL=redis://localhost:6379
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: msva
    ports:
      - "5432:5432"
    volumes:
      - msva-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - msva-redis:/data

volumes:
  msva-pg:
  msva-redis:
